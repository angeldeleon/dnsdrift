[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dnsdrift"
version = "0.1.0"
description = "Agentless drift detection for DNS, email authentication and TLS posture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Angel De Leon" }]
keywords = [
    "dns",
    "dmarc",
    "spf",
    "dkim",
    "dnssec",
    "tls",
    "certificate-transparency",
    "subdomain-takeover",
    "attack-surface",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    "dnspython>=2.6.1",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/angeldeleon/dnsdrift"
Repository = "https://github.com/angeldeleon/dnsdrift"
Issues = "https://github.com/angeldeleon/dnsdrift/issues"
Changelog = "https://github.com/angeldeleon/dnsdrift/blob/main/CHANGELOG.md"

[project.scripts]
dnsdrift = "dnsdrift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dnsdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that make real outbound network requests (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "B",    # bugbear
    "S",    # bandit-equivalent security rules
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "RET",  # return consistency
    "SIM",  # simplify
]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # assert is fine in tests and for type narrowing
    "RET504", # named returns aid readability
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately exercise error paths and use hardcoded fixtures.
"tests/*" = ["S105", "S106", "S311", "S603", "S607"]
# The TLS check must complete handshakes with invalid certificates in order to
# report on them; see the module docstring for the full rationale.
"src/dnsdrift/checks/tls.py" = ["S323"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["dns.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/dnsdrift"]
branch = true
