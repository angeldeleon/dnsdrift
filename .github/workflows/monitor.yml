# Scheduled monitoring — the intended way to run dnsdrift.
#
# Fork this repo (or copy this file), add your own domains.yml, set a
# SLACK_WEBHOOK_URL secret, then uncomment the schedule below and you have
# daily posture monitoring with alerts and findings in the Security tab. No
# servers, no database.
#
# The schedule ships commented out on purpose: this repository has no
# domains.yml, so a cron here would only produce a daily red run for anyone who
# forked it and had not finished setting it up yet.
#
# The state file is committed back to the repo after each run. That is what
# makes drift detection work across runs — and it turns your git history into
# an audit log of every change to your domains' posture.
#
# NOTE: the state file contains an inventory of your domains, mail routing and
# certificate metadata. Not secret, but a useful map for an attacker. Use a
# private repository.

name: Monitor domains

on:
  # schedule: re-enable after adding your own domains.yml (see header)
  #   - cron: "0 13 * * *" # daily at 13:00 UTC
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the updated baseline
      security-events: write # to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dnsdrift
        run: pip install .

      - name: Scan
        id: scan
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Optional. Leave unset to keep the AI summary off.
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Actions runs this with `bash -e`. `set -uo pipefail` turns on -u and
          # pipefail but does NOT clear the inherited -e, so without `set +e` an
          # exit of 1 or 2 — the two outcomes the steps below exist to react to —
          # kills this step before the code can be recorded, and every failure
          # then looks identical.
          set +e
          set -uo pipefail

          # One scan, two renderings. Running dnsdrift a second time to produce
          # the SARIF would diff against the baseline this run just saved, so
          # the file uploaded to code scanning would contain no drift at all.
          dnsdrift scan \
            -c domains.yml \
            --state .dnsdrift/state.json \
            -o report.md \
            --extra-output sarif:findings.sarif \
            -v
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          # The step itself always succeeds; the dedicated steps below turn the
          # recorded code into a job result, so that "found problems" and "could
          # not check" stay distinguishable in the Actions UI.
          exit 0

      - name: Publish the report to the job summary
        if: always()
        run: |
          set -uo pipefail
          # A config error exits before anything is rendered, so do not turn a
          # missing file into a second, more confusing failure.
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dnsdrift wrote no report; see the Scan step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload findings to code scanning
        if: always() && hashFiles('findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: findings.sarif
          category: dnsdrift

      - name: Commit the updated baseline
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .dnsdrift/state.json || { echo "No baseline written this run."; exit 0; }
          if git diff --staged --quiet; then
            echo "No posture changes; baseline unchanged."
          else
            git commit -m "chore: update dnsdrift baseline [skip ci]"
            git push
          fi

      - name: Fail the run if findings met the threshold
        if: steps.scan.outputs.exit_code == '1'
        run: |
          echo "::error::dnsdrift found issues at or above the configured severity. See the job summary."
          exit 1

      - name: Fail loudly if the scan could not run
        if: steps.scan.outputs.exit_code == '2'
        run: |
          echo "::error::dnsdrift could not complete the scan. A monitor that silently stops running is worse than one that fails."
          exit 1
