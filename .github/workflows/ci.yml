name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so dependency advisories surface even when nothing is being pushed.
    - cron: "17 6 * * 1"

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        # Network-marked tests are excluded: CI must not depend on third-party
        # DNS or on crt.sh being up.
        run: pytest -m "not network" --cov --cov-report=term-missing

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit
        run: bandit -r src/ -c pyproject.toml

      - name: pip-audit
        # Audit the project's declared dependencies, not the installed
        # environment. The environment contains dnsdrift itself as an editable
        # install, which pip-audit cannot resolve on PyPI, and --strict treats
        # an unauditable package as a hard failure.
        run: pip-audit --strict --desc on .

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate the shipped example config
        run: dnsdrift validate -c domains.example.yml

      - name: Scan a real domain and confirm the drift loop works
        # Two runs against the same state file: the first must report no
        # baseline, the second must find one. This catches state-handling
        # regressions that unit tests with a tmpdir would not.
        run: |
          set -euo pipefail
          printf 'domains:\n  - name: example.com\n    checks: [dmarc, caa, dnssec]\n' > ci-domains.yml

          dnsdrift scan -c ci-domains.yml --state ci-state.json -o run1.md --fail-on critical
          grep -q "this run establishes the baseline" run1.md

          dnsdrift scan -c ci-domains.yml --state ci-state.json -o run2.md --fail-on critical
          grep -q "compared against previous scan" run2.md

          dnsdrift scan -c ci-domains.yml --state ci-state.json -f sarif -o findings.sarif --no-save
          python -c "import json,sys; d=json.load(open('findings.sarif')); assert d['version']=='2.1.0'; print('SARIF OK')"

      - name: Confirm a bad config exits 2, not 0
        run: |
          set -euo pipefail
          printf 'domains:\n  - "not a domain"\n' > bad.yml
          if dnsdrift scan -c bad.yml --state ci-state.json; then
            echo "expected a non-zero exit for an invalid config"; exit 1
          fi
          dnsdrift scan -c bad.yml --state ci-state.json && rc=0 || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2, got $rc"; exit 1; }
